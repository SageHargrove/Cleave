name: synthgen

on:
  push:
    branches: [main]
    paths: ["synthgen/**", ".github/workflows/synthgen.yml"]
  pull_request:
    paths: ["synthgen/**", ".github/workflows/synthgen.yml"]

defaults:
  run:
    working-directory: synthgen

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy synthgen

      - name: Tests
        run: pytest -q

  determinism:
    # The core promise: the same seed produces byte-identical output on a
    # different OS than the one the goldens were taken on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - name: Generate twice, compare
        run: |
          python -m synthgen --tier small --seed 42 --out ./a
          python -m synthgen --tier small --seed 42 --out ./b
          diff -r ./a ./b && echo "byte-identical across runs"
